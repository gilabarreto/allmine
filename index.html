<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ALLMINE</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { display: grid; place-items: center; background: #3d4f9a; font-family: 'Press Start 2P', monospace; }
  /* Everything inside #stage is placed in % of the map image, so it scales with it. */
  /* Cover the screen: the map is scaled to touch every side, and the overflow is clipped (body overflow: hidden).
     Anchored to the top (the minefield is in the upper half) and centered on the strait (x 1216 of 2304),
     clamped so no edge of the screen is left uncovered. Cells cut off leave the game (see visibleCells()). */
  :root { --w: max(100vw, 100dvh * 2304 / 1846); }
  #stage { position: absolute; top: 0; width: var(--w);
           left: clamp(100vw - var(--w), 50vw - var(--w) * 0.528, 0px); container-type: inline-size; }
  #map { position: relative; z-index: 2; display: block; width: 100%; pointer-events: none; }
  #bar, #grid { position: absolute; left: 0; width: 100%; }
  #bar { display: flex; justify-content: center; align-items: center; background: #c0c0c0; border-bottom: 0.3cqw solid #808080; }
  /* 2x its old in-map size (2.4% of the map width), never below a comfortable touch target. */
  #face { position: fixed; top: 12px; right: 12px; z-index: 3; --s: max(48px, var(--w) * 0.048);
          width: var(--s); height: var(--s); padding: 0; border: calc(var(--s) * 0.1) outset #fff; background: #c0c0c0; cursor: pointer; }
  #face img { width: 100%; height: 100%; display: block; }
  #grid { display: grid; }
  #grid button { padding: 0; font: 1.4cqw 'Press Start 2P', monospace; border: 0.25cqw outset #fff; background: #c0c0c0; cursor: pointer; }
  #grid button.open { border: 1px solid #808080; cursor: default; }
  #grid button.boom { background: #f00; }
  #grid button.off { cursor: default; }
  .n1{color:#00f}.n2{color:#008000}.n3{color:#f00}.n4{color:#000080}.n5{color:#800000}.n6{color:#008080}.n7{color:#000}.n8{color:#808080}
  /* Screen-centered, with #face's width reserved on both sides so they never overlap;
     sizes in em so the whole HUD shrinks on narrow screens. */
  #hud { position: fixed; top: 12px; left: 0; right: 0; padding: 0 calc(24px + max(48px, var(--w) * 0.048)); z-index: 3;
         display: flex; justify-content: center; gap: 0.86em; align-items: center;
         color: #fff; text-shadow: 0.14em 0.14em 0 #000; font-size: min(21px, 4.3vw); white-space: nowrap; }
  #hud button { font-size: 1.43em; width: 2em; height: 2em; border: 0.14em outset #fff; background: #c0c0c0; cursor: pointer; }
  #hud button[aria-pressed="true"] { border-style: inset; background: #ffd23f; }
</style>
</head>
<body>
<div id="hud">
  <span>ALLMINE</span>
  <span id="left"></span>
  <button id="flagMode" aria-pressed="false" aria-label="Modo bandeira (ou botão direito)">🚩</button>
</div>
<button id="face" aria-label="Novo jogo"><img id="faceImg" src="trump.webp" alt=""></button>
<div id="stage">
  <div id="bar"></div>
  <div id="grid"></div>
  <img id="map" src="hormuz.webp" alt="Estreito de Ormuz">
</div>
<script src="mines.js"></script>
<script>
  // Board geometry in hormuz.webp pixels (2304x1846). Tweak to move/resize the minefield.
  const IMG_W = 2304, IMG_H = 1846, CELL = 64, BAR_Y = 200, GRID_Y = 264, COLS = 36, ROWS = 10;
  const MINE_RATIO = 0.15;

  const pct = (v, total) => `${v / total * 100}%`;
  const grid = document.getElementById('grid'), bar = document.getElementById('bar'), face = document.getElementById('face');
  const left = document.getElementById('left'), flagMode = document.getElementById('flagMode'), map = document.getElementById('map'), faceImg = document.getElementById('faceImg');
  new Image().src = 'trump-sad.webp'; // preload so the swap is instant
  bar.style.top = pct(BAR_Y, IMG_H); bar.style.height = pct(GRID_Y - BAR_Y, IMG_H);
  grid.style.top = pct(GRID_Y, IMG_H); grid.style.height = pct(ROWS * CELL, IMG_H);
  grid.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;
  grid.style.gridTemplateRows = `repeat(${ROWS}, 1fr)`;

  // A cell is land when most of it is opaque in the map (the sea is transparent).
  let land;
  function measureLand() {
    const S = 8, c = document.createElement('canvas');
    c.width = COLS * S; c.height = ROWS * S;
    const ctx = c.getContext('2d');
    ctx.drawImage(map, 0, GRID_Y, COLS * CELL, ROWS * CELL, 0, 0, c.width, c.height);
    const a = ctx.getImageData(0, 0, c.width, c.height).data;
    land = Array.from({ length: COLS * ROWS }, (_, i) => {
      const cx = i % COLS, cy = Math.floor(i / COLS);
      let opaque = 0;
      for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) if (a[((cy * S + y) * c.width + cx * S + x) * 4 + 3] > 128) opaque++;
      return opaque > S * S / 2;
    });
  }

  // Cells fully on screen; only these are playable.
  function visibleCells() {
    const r = grid.getBoundingClientRect(), cw = r.width / COLS, ch = r.height / ROWS;
    return Array.from({ length: COLS * ROWS }, (_, i) => {
      const x = r.left + (i % COLS) * cw, y = r.top + Math.floor(i / COLS) * ch;
      return x >= -1 && y >= -1 && x + cw <= innerWidth + 1 && y + ch <= innerHeight + 1;
    });
  }

  let b, cols;
  function render() {
    const over = b.state === 'won' || b.state === 'lost';
    grid.replaceChildren(...b.cells.map((c, i) => {
      const el = document.createElement('button');
      const show = c.open || (b.state === 'lost' && c.mine);
      el.textContent = show ? (c.mine ? '💣' : c.n || '') : c.flag ? '🚩' : '';
      el.className = (c.off ? 'off' : '') + (show ? ' open' : '') + (show && c.n && !c.mine ? ` n${c.n}` : '') + (c.open && c.mine ? ' boom' : '');
      if (c.off) { el.tabIndex = -1; el.ariaHidden = 'true'; return el; }
      el.setAttribute('aria-label', show ? (c.mine ? 'mina' : `${c.n} minas ao redor`) : c.flag ? 'bandeira' : 'fechada');
      el.disabled = over;
      el.onclick = () => { flagMode.ariaPressed === 'true' ? toggleFlag(b, i) : reveal(b, i); render(); };
      el.oncontextmenu = e => { e.preventDefault(); toggleFlag(b, i); render(); };
      return el;
    }));
    left.textContent = `💣${b.mines - b.cells.filter(c => c.flag).length}`;
    faceImg.src = b.state === 'lost' ? 'trump-sad.webp' : 'trump.webp';
  }

  function newGame() {
    cols = visibleCells();
    const off = i => land[i] || !cols[i];
    const sea = land.filter((_, i) => !off(i)).length;
    b = makeBoard(COLS, ROWS, Math.round(sea * MINE_RATIO), off);
    render();
  }
  face.onclick = newGame;
  flagMode.onclick = () => { flagMode.ariaPressed = flagMode.ariaPressed === 'true' ? 'false' : 'true'; };

  map.decode().then(() => {
    measureLand();
    newGame();
    // ponytail: a resize that changes the visible cells (e.g. rotating the phone) restarts the game.
    addEventListener('resize', () => { if (visibleCells().join() !== cols.join()) newGame(); });
  });
</script>
</body>
</html>
